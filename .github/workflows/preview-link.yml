name: Preview link

on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: >-
      startsWith(github.event.check_run.name, 'Workers Builds') &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.check_run.pull_requests[0];
            const slug = pr.head.ref
              .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const url = `https://${slug}-nornscode-com.personal-502.workers.dev/`;
            const marker = '<!-- preview-link -->';
            const sha = context.payload.check_run.head_sha.slice(0, 7);
            const body = `${marker}\nPreview: ${url}\n\nBuilt from ${sha}.`;
            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
